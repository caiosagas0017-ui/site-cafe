<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renomeador de NF e OC</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
      padding: 1.5rem 2rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { opacity: 0.9; margin-top: 0.3rem; font-size: 0.95rem; }
    .content { padding: 1.5rem 2rem 2rem; }
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      transition: all 0.2s;
      cursor: pointer;
      background: #f8fafc;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .upload-area input { display: none; }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 1rem;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-zip {
      background: #7c3aed;
      margin-left: 0.6rem;
    }
    .btn-zip:hover { background: #6d28d9; }
    .btn-sm {
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      margin-top: 0;
    }
    #status {
      margin-top: 1.2rem;
      padding: 0.9rem 1rem;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
    }
    #status.processing { display: block; background: #fef3c7; color: #92400e; }
    #status.success { display: block; background: #d1fae5; color: #065f46; }
    #status.error { display: block; background: #fee2e2; color: #991b1b; }
    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-top: 0.8rem;
      overflow: hidden;
      display: none;
    }
    .progress-bar .fill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width 0.3s;
    }
    .results {
      margin-top: 1.5rem;
      display: none;
    }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .results h3 {
      color: #1e40af;
      font-size: 1.1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.75rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background: #f1f5f9;
      font-weight: 600;
      color: #475569;
    }
    tr:hover { background: #f8fafc; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-ok { background: #d1fae5; color: #065f46; }
    .badge-err { background: #fee2e2; color: #991b1b; }
    .filename {
      font-family: monospace;
      font-size: 0.84rem;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .newname {
      font-family: monospace;
      font-weight: 700;
      color: #1e40af;
      font-size: 0.88rem;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Renomeador de NF e OC</h1>
      <p>Analisa página 1 e 2 • Renomeia • Baixa tudo em ZIP</p>
    </header>

    <div class="content">
      <div class="upload-area" id="dropZone">
        <p style="font-size: 1.1rem; margin-bottom: 0.4rem;">Arraste os PDFs aqui ou clique para selecionar</p>
        <p style="color: #64748b; font-size: 0.9rem;">Pode enviar muitos arquivos de uma vez</p>
        <input type="file" id="fileInput" accept=".pdf,image/*" multiple>
        <button class="btn" onclick="document.getElementById('fileInput').click()">Selecionar arquivos</button>
      </div>

      <div id="status"></div>
      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

      <div class="results" id="results">
        <div class="results-header">
          <h3>Arquivos processados</h3>
          <div>
            <button class="btn btn-success btn-sm" id="btnDownloadAll" style="display:none;">
              Baixar todos em ZIP
            </button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Arquivo original</th>
              <th>NF</th>
              <th>OC</th>
              <th>Novo nome</th>
              <th>Status</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <canvas id="pdfCanvas"></canvas>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const resultsDiv = document.getElementById('results');
    const resultsBody = document.getElementById('resultsBody');
    const btnDownloadAll = document.getElementById('btnDownloadAll');

    let isProcessing = false;
    let successfulFiles = []; // guarda os arquivos que deram certo

    // Drag & Drop
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) startBatch(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) startBatch(fileInput.files);
    });

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type;
      statusEl.style.display = 'block';
    }

    async function startBatch(fileList) {
      if (isProcessing) return;
      isProcessing = true;
      successfulFiles = [];

      const files = Array.from(fileList);
      resultsBody.innerHTML = '';
      resultsDiv.style.display = 'block';
      btnDownloadAll.style.display = 'none';
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';

      setStatus(`Processando ${files.length} arquivo(s)...`, 'processing');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const percent = Math.round((i / files.length) * 100);
        progressFill.style.width = percent + '%';
        setStatus(`Processando ${i + 1} de ${files.length}: ${file.name}`, 'processing');

        try {
          const result = await processSingleFile(file);
          addResultRow(file, result);
        } catch (err) {
          console.error(err);
          addResultRow(file, { nf: null, oc: null, error: err.message });
        }
      }

      progressFill.style.width = '100%';
      setStatus(`Concluído! ${files.length} arquivo(s) processado(s).`, 'success');
      isProcessing = false;

      // Mostra o botão de ZIP se tiver pelo menos 1 sucesso
      if (successfulFiles.length > 0) {
        btnDownloadAll.style.display = 'inline-block';
        btnDownloadAll.textContent = `Baixar todos em ZIP (${successfulFiles.length})`;
      }
    }

    async function processSingleFile(file) {
      let fullText = '';

      if (file.type === 'application/pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;
        const pagesToRead = Math.min(totalPages, 2); // página 1 e 2

        for (let p = 1; p <= pagesToRead; p++) {
          const page = await pdf.getPage(p);
          const scale = 2.0;
          const viewport = page.getViewport({ scale });
          const canvas = document.getElementById('pdfCanvas');
          const ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: ctx, viewport }).promise;
          const dataUrl = canvas.toDataURL('image/png');

          const { data: { text } } = await Tesseract.recognize(dataUrl, 'por+eng', {
            logger: () => {}
          });

          fullText += `\n--- PÁGINA ${p} ---\n` + text;
        }
      } else if (file.type.startsWith('image/')) {
        const dataUrl = await fileToDataUrl(file);
        const { data: { text } } = await Tesseract.recognize(dataUrl, 'por+eng');
        fullText = text;
      } else {
        throw new Error('Formato não suportado');
      }

      const nf = findNF(fullText);
      const oc = findOC(fullText);

      return { nf, oc };
    }

    function addResultRow(file, result) {
      const tr = document.createElement('tr');
      const nf = result.nf || '—';
      const oc = result.oc || '—';
      const success = !!(result.nf && result.oc);
      const newName = success ? `NF_${result.nf}_OC_${result.oc}.pdf` : '—';

      let actionHtml = '—';
      if (success) {
        actionHtml = `<button class="btn btn-success btn-sm">Baixar</button>`;
        // Guarda para o ZIP
        successfulFiles.push({ file, newName });
      }

      tr.innerHTML = `
        <td class="filename" title="${file.name}">${file.name}</td>
        <td><strong>${nf}</strong></td>
        <td><strong>${oc}</strong></td>
        <td class="newname">${newName}</td>
        <td>
          <span class="badge ${success ? 'badge-ok' : 'badge-err'}">
            ${success ? 'OK' : 'Falha'}
          </span>
        </td>
        <td>${actionHtml}</td>
      `;

      resultsBody.appendChild(tr);

      // Botão individual
      if (success) {
        const btn = tr.querySelector('button');
        btn.addEventListener('click', () => {
          downloadSingle(file, newName);
        });
      }
    }

    function downloadSingle(file, newName) {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = newName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ===================== BAIXAR TODOS EM ZIP =====================
    btnDownloadAll.addEventListener('click', async () => {
      if (successfulFiles.length === 0) return;

      btnDownloadAll.disabled = true;
      btnDownloadAll.textContent = 'Gerando ZIP...';

      try {
        const zip = new JSZip();

        for (const item of successfulFiles) {
          const arrayBuffer = await item.file.arrayBuffer();
          zip.file(item.newName, arrayBuffer);
        }

        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        a.download = `NFs_renomeadas_${new Date().toISOString().slice(0,10)}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        btnDownloadAll.textContent = `Baixar todos em ZIP (${successfulFiles.length})`;
      } catch (err) {
        console.error(err);
        alert('Erro ao gerar o ZIP: ' + err.message);
        btnDownloadAll.textContent = `Baixar todos em ZIP (${successfulFiles.length})`;
      }

      btnDownloadAll.disabled = false;
    });

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ===================== EXTRAÇÃO DE NF =====================
    function findNF(text) {
      const patterns = [
        /(?:N[ºo°.]?\s*|NF-?e?\s*N[ºo°.]?\s*|N[ºo°.]\s*)([0-9]{3}[.\s]?[0-9]{3}[.\s]?[0-9]{3})/gi,
        /(?:N[ºo°.]?\s*|NF-?e?\s*)([0-9]{6,9})/gi,
        /NF-?e?\s*(?:N[ºo°.]?\s*)?([0-9]{3}\.[0-9]{3}\.[0-9]{3})/gi,
        /N[ºo°.]\s*([0-9]{3}\.[0-9]{3}\.[0-9]{3})/gi,
        /([0-9]{3}\.[0-9]{3}\.[0-9]{3})/g
      ];

      const candidates = [];
      for (const pat of patterns) {
        let m;
        while ((m = pat.exec(text)) !== null) {
          const cleaned = m[1].replace(/[.\s]/g, '');
          if (cleaned.length >= 6 && cleaned.length <= 9 && /^\d+$/.test(cleaned)) {
            candidates.push(cleaned);
          }
        }
      }

      if (candidates.length) {
        candidates.sort((a, b) => (b.length === 9 ? 1 : 0) - (a.length === 9 ? 1 : 0));
        return candidates[0];
      }
      return null;
    }

    // ===================== EXTRAÇÃO DE OC =====================
    function findOC(text) {
      // Padrão prioritário (da imagem que você mandou)
      const priority = [
        /Ord\.?\s*Compra\s*[:\-]?\s*([0-9]{4,8})/gi,
        /Ordem\s+de\s+Compra\s*[:\-]?\s*([0-9]{4,8})/gi,
        /Ordem\s+Compra\s*[:\-]?\s*([0-9]{4,8})/gi,
      ];

      for (const pat of priority) {
        const m = pat.exec(text);
        if (m) return m[1].replace(/[.\s]/g, '');
      }

      const secondary = [
        /(?:OC|O\.C\.)\s*[:\-]?\s*([0-9]{4,8})/gi,
        /(?:N[ºo°.]\s*)?Pedido\s*[:\-]?\s*([0-9]{4,8})/gi,
        /Pedido\s+de\s+Compra\s*[:\-]?\s*([0-9]{4,8})/gi,
        /(?:loc|joc|0c0|oc0)\s*[:\-]?\s*([0-9]{4,8})/gi,
      ];

      for (const pat of secondary) {
        const m = pat.exec(text);
        if (m) return m[1].replace(/[.\s]/g, '');
      }

      return null;
    }
  </script>
</body>
</html>
