<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renomeador NF + OC</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #0f172a; padding: 1.5rem; }
    .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); overflow: hidden; }
    header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 1.4rem 2rem; }
    header h1 { font-size: 1.4rem; }
    header p { opacity: 0.9; font-size: 0.95rem; margin-top: 0.3rem; }
    .content { padding: 1.5rem 2rem 2rem; }
    .upload-area { border: 2px dashed #cbd5e1; border-radius: 14px; padding: 2.2rem; text-align: center; cursor: pointer; background: #f8fafc; }
    .upload-area:hover, .upload-area.dragover { border-color: #3b82f6; background: #eff6ff; }
    .upload-area input { display: none; }
    .btn { background: #2563eb; color: white; border: none; padding: 0.65rem 1.3rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .btn:hover { background: #1d4ed8; }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-purple { background: #7c3aed; }
    .btn-purple:hover { background: #6d28d9; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.82rem; }
    #status { margin-top: 1.2rem; padding: 0.85rem 1rem; border-radius: 8px; display: none; }
    #status.processing { display: block; background: #fef3c7; color: #92400e; }
    #status.success { display: block; background: #d1fae5; color: #065f46; }
    .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; margin-top: 0.8rem; overflow: hidden; display: none; }
    .progress-bar .fill { height: 100%; background: #3b82f6; width: 0%; transition: width 0.25s; }
    .results { margin-top: 1.8rem; display: none; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    th, td { padding: 0.7rem 0.75rem; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
    th { background: #f1f5f9; font-weight: 600; color: #475569; font-size: 0.82rem; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
    .badge-mixed { background: #e0e7ff; color: #3730a3; }
    .badge-nf { background: #dbeafe; color: #1e40af; }
    .badge-oc { background: #d1fae5; color: #065f46; }
    .badge-unknown { background: #f1f5f9; color: #64748b; }
    .badge-high { background: #d1fae5; color: #065f46; }
    .badge-medium { background: #fef3c7; color: #92400e; }
    .badge-low { background: #fee2e2; color: #991b1b; }
    .filename { font-family: monospace; font-size: 0.82rem; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .newname-input { width: 100%; max-width: 260px; padding: 0.35rem 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font-family: monospace; font-size: 0.82rem; }
    .info-small { font-size: 0.78rem; color: #64748b; line-height: 1.4; }
    .log-box { margin-top: 6px; padding: 8px 10px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px; font-size: 0.75rem; color: #9a3412; white-space: pre-wrap; max-width: 340px; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Renomeador Inteligente</h1>
      <p>NF + OC — Otimizado para os dois modelos que você usa</p>
    </header>

    <div class="content">
      <div class="upload-area" id="dropZone">
        <p style="font-size: 1.15rem; font-weight: 600; margin-bottom: 0.4rem;">Arraste os PDFs aqui</p>
        <p style="color: #64748b; font-size: 0.9rem;">Suporta PDF, XML e imagens</p>
        <input type="file" id="fileInput" accept=".pdf,.xml,image/*" multiple>
        <br>
        <button class="btn" style="margin-top: 1.1rem;" onclick="document.getElementById('fileInput').click()">Selecionar arquivos</button>
      </div>

      <div id="status"></div>
      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

      <div class="results" id="results">
        <div class="results-header">
          <h3>Arquivos analisados</h3>
          <div>
            <button class="btn btn-purple btn-sm" id="btnDownloadAll" style="display:none;">Baixar todos em ZIP</button>
            <button class="btn btn-danger btn-sm" id="btnClearList" style="display:none; margin-left:6px;">Limpar lista</button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Arquivo</th>
              <th>Tipo</th>
              <th>Confiança</th>
              <th>Informações + Log</th>
              <th>Novo nome</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <canvas id="pdfCanvas"></canvas>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let isProcessing = false;
    let successfulFiles = [];

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const resultsDiv = document.getElementById('results');
    const resultsBody = document.getElementById('resultsBody');
    const btnDownloadAll = document.getElementById('btnDownloadAll');
    const btnClearList = document.getElementById('btnClearList');

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) startBatch(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) startBatch(fileInput.files);
    });

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = type;
      statusEl.style.display = 'block';
    }

    function sanitizeFileName(name) {
      return name.replace(/[\/\\:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim().substring(0, 180);
    }

    function getExtension(filename) {
      const parts = filename.split('.');
      return parts.length > 1 ? parts.pop().toLowerCase() : 'pdf';
    }

    // ====================== EXTRAÇÃO DE TEXTO ======================
    async function extractTextFromFile(file) {
      const ext = getExtension(file.name);

      if (ext === 'xml' || file.type.includes('xml')) {
        return { text: await file.text(), isXml: true };
      }

      if (file.type === 'application/pdf' || ext === 'pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const maxPages = Math.min(pdf.numPages, 2); // analisa página 1 e 2
        let fullText = '';

        for (let p = 1; p <= maxPages; p++) {
          const page = await pdf.getPage(p);
          const viewport = page.getViewport({ scale: 2.3 });
          const canvas = document.getElementById('pdfCanvas');
          const ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: ctx, viewport }).promise;
          const dataUrl = canvas.toDataURL('image/png');

          const { data: { text } } = await Tesseract.recognize(dataUrl, 'por+eng', {
            logger: () => {}
          });
          fullText += `\n--- PAGINA ${p} ---\n` + text;
        }
        return { text: fullText, isXml: false };
      }

      if (file.type.startsWith('image/')) {
        const dataUrl = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
        const { data: { text } } = await Tesseract.recognize(dataUrl, 'por+eng');
        return { text, isXml: false };
      }

      throw new Error('Formato não suportado');
    }

    // ====================== LIMPEZA ======================
    function cleanText(text) {
      return text
        .replace(/[|/\\]/g, ' ')
        .replace(/\s+/g, ' ')
        .replace(/[oO]/g, '0')
        .replace(/[lI|]/g, '1')
        .trim();
    }

    // ====================== EXTRAÇÃO DE NF ======================
    function findNF(text) {
      const cleaned = cleanText(text);

      const patterns = [
        /(?:N[ºo°.]?\s*|NF-?e?\s*N[ºo°.]?\s*|N[ºo°.]\s*)([0-9]{3}[.\s]?[0-9]{3}[.\s]?[0-9]{3})/i,
        /([0-9]{3}\.[0-9]{3}\.[0-9]{3})/,
        /(?:N[ºo°.]?\s*|NF-?e?\s*)([0-9]{6,9})/i,
        /\b([0-9]{6,9})\b/
      ];

      for (const pattern of patterns) {
        const match = cleaned.match(pattern);
        if (match) {
          const number = match[1].replace(/[.\s]/g, '');
          if (number.length >= 6 && number.length <= 9) return number;
        }
      }
      return null;
    }

    // ====================== EXTRAÇÃO DE OC (MUITO REFORÇADA) ======================
    function findOC(text) {
      const cleaned = cleanText(text);

      // Padrões prioritários (baseados nos seus dois modelos)
      const patterns = [
        // Modelo 1: ORDEM DE COMPRA N° 32183
        /ORDEM\s+DE\s+COMPRA\s+N[ºo°.]?\s*([0-9]{4,10})/i,
        /ORDEM\s+DE\s+COMPRA\s*[:.\-]?\s*N[ºo°.]?\s*([0-9]{4,10})/i,
        /ORDEM\s+DE\s+COMPRA\s*[:.\-]?\s*([0-9]{4,10})/i,

        // Modelo 2: Soc: 161676
        /(?:Soc|SOC)\s*[:.\-]?\s*([0-9]{5,10})/i,

        // Outros padrões comuns
        /Pedido\s+Cliente\s*[:.\-]?\s*([0-9]{4,10})/i,
        /Pedido\s*[:.\-]?\s*([0-9]{4,10})/i,
        /N[ºo°.]\s*(?:do\s+)?Pedido\s*[:.\-]?\s*([0-9]{4,10})/i,
        /Ord(?:em)?\.?\s*Compra\s*[:.\-]?\s*([0-9]{4,10})/i,
        /(?:OC|O\.C\.)\s*[:.\-]?\s*([0-9]{4,10})/i,
        /Pedido\s+(?:de\s+)?Compra\s*[:.\-]?\s*([0-9]{4,10})/i,
      ];

      for (const pattern of patterns) {
        const match = cleaned.match(pattern);
        if (match && match[1]) {
          return match[1];
        }
      }

      // Fallback: número perto das palavras-chave
      const fallback = [
        /(?:ordem\s+de\s+compra|soc|pedido|oc)[^\d]{0,25}(\d{4,8})/i,
        /(\d{4,8})[^\d]{0,20}(?:ordem\s+de\s+compra|soc|pedido|oc)/i
      ];

      for (const pattern of fallback) {
        const match = cleaned.match(pattern);
        if (match && match[1]) return match[1];
      }

      return null;
    }

    // ====================== ANÁLISE ======================
    function analyzeDocument(text, isXml) {
      const result = {
        type: 'unknown',
        confidence: 'low',
        fields: { nf: null, oc: null },
        log: []
      };

      // NF
      if (isXml) {
        const nNF = text.match(/<nNF>(\d+)<\/nNF>/i);
        if (nNF) {
          result.fields.nf = nNF[1];
          result.log.push(`✅ NF encontrada no XML: ${nNF[1]}`);
        }
      } else {
        result.fields.nf = findNF(text);
        if (result.fields.nf) {
          result.log.push(`✅ NF encontrada: ${result.fields.nf}`);
        } else {
          result.log.push(`❌ NF NÃO encontrada`);
        }
      }

      // OC
      result.fields.oc = findOC(text);
      if (result.fields.oc) {
        result.log.push(`✅ OC encontrada: ${result.fields.oc}`);
      } else {
        result.log.push(`❌ OC NÃO encontrada`);
      }

      // Tipo
      if (result.fields.nf && result.fields.oc) {
        result.type = 'mixed';
        result.confidence = 'high';
      } else if (result.fields.nf) {
        result.type = 'nf';
        result.confidence = 'high';
      } else if (result.fields.oc) {
        result.type = 'oc';
        result.confidence = 'medium';
      } else {
        result.confidence = 'low';
        const preview = text.replace(/\s+/g, ' ').substring(0, 400);
        result.log.push(`\n📄 Texto lido pelo OCR:\n"${preview}..."`);
      }

      return result;
    }

    // ====================== NOME ======================
    function generateFileName(analysis, originalName) {
      const ext = getExtension(originalName);
      const f = analysis.fields;

      let name = '';
      if (f.nf && f.oc) name = `NF_${f.nf}_OC_${f.oc}`;
      else if (f.nf) name = `NF_${f.nf}`;
      else if (f.oc) name = `OC_${f.oc}`;
      else name = originalName.replace(/\.[^/.]+$/, '');

      return sanitizeFileName(name) + '.' + ext;
    }

    // ====================== PROCESSAMENTO ======================
    async function startBatch(fileList) {
      if (isProcessing) return;
      isProcessing = true;
      successfulFiles = [];

      const files = Array.from(fileList);
      resultsBody.innerHTML = '';
      resultsDiv.style.display = 'block';
      btnDownloadAll.style.display = 'none';
      btnClearList.style.display = 'none';
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';

      setStatus(`Analisando ${files.length} arquivo(s)...`, 'processing');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        progressFill.style.width = Math.round((i / files.length) * 100) + '%';
        setStatus(`Analisando ${i + 1}/${files.length}: ${file.name}`, 'processing');

        try {
          const { text, isXml } = await extractTextFromFile(file);
          const analysis = analyzeDocument(text, isXml);
          const suggestedName = generateFileName(analysis, file.name);
          addResultRow(file, analysis, suggestedName);
        } catch (err) {
          console.error(err);
          addResultRow(file, { type: 'error', confidence: 'low', fields: {}, log: [err.message] }, null);
        }
      }

      progressFill.style.width = '100%';
      setStatus(`Concluído! ${files.length} arquivo(s) processado(s).`, 'success');
      isProcessing = false;

      btnClearList.style.display = 'inline-block';
      if (successfulFiles.length > 0) {
        btnDownloadAll.style.display = 'inline-block';
        btnDownloadAll.textContent = `Baixar todos em ZIP (${successfulFiles.length})`;
      }
    }

    function addResultRow(file, analysis, suggestedName) {
      const tr = document.createElement('tr');

      let typeBadge = 'badge-unknown', typeLabel = '⚪ Não identificado';
      if (analysis.type === 'mixed') { typeBadge = 'badge-mixed'; typeLabel = '🟢 NF + OC'; }
      else if (analysis.type === 'nf') { typeBadge = 'badge-nf'; typeLabel = '🟢 NF'; }
      else if (analysis.type === 'oc') { typeBadge = 'badge-oc'; typeLabel = '🔵 OC'; }

      const confClass = analysis.confidence === 'high' ? 'badge-high' :
                        analysis.confidence === 'medium' ? 'badge-medium' : 'badge-low';
      const confLabel = analysis.confidence === 'high' ? 'Alta' :
                        analysis.confidence === 'medium' ? 'Média' : 'Baixa';

      let infoHtml = '';
      if (analysis.fields.nf) infoHtml += `NF: <strong>${analysis.fields.nf}</strong><br>`;
      if (analysis.fields.oc) infoHtml += `OC: <strong>${analysis.fields.oc}</strong><br>`;

      if (analysis.log && analysis.log.length) {
        infoHtml += `<div class="log-box">${analysis.log.join('\n')}</div>`;
      }

      const canDownload = suggestedName && analysis.type !== 'unknown' && analysis.type !== 'error';

      tr.innerHTML = `
        <td class="filename" title="${file.name}">${file.name}</td>
        <td><span class="badge ${typeBadge}">${typeLabel}</span></td>
        <td><span class="badge ${confClass}">${confLabel}</span></td>
        <td class="info-small">${infoHtml || '—'}</td>
        <td><input type="text" class="newname-input" value="${suggestedName || file.name}"></td>
        <td>${canDownload ? '<button class="btn btn-success btn-sm">Baixar</button>' : '—'}</td>
      `;

      resultsBody.appendChild(tr);

      if (canDownload) {
        const input = tr.querySelector('.newname-input');
        const btn = tr.querySelector('button');
        successfulFiles.push({ file, input, originalSuggested: suggestedName });

        btn.addEventListener('click', () => {
          downloadSingle(file, sanitizeFileName(input.value) || suggestedName);
        });
      }
    }

    function downloadSingle(file, newName) {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = newName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ZIP
    btnDownloadAll.addEventListener('click', async () => {
      if (!successfulFiles.length) return;
      btnDownloadAll.disabled = true;
      btnDownloadAll.textContent = 'Gerando ZIP...';

      try {
        const zip = new JSZip();
        const used = new Map();

        for (const item of successfulFiles) {
          let name = sanitizeFileName(item.input.value) || item.originalSuggested;
          let base = name.replace(/\.[^/.]+$/, '');
          let ext = getExtension(name);
          let count = used.get(base) || 0;
          if (count > 0) name = `${base} (${count + 1}).${ext}`;
          used.set(base, count + 1);
          zip.file(name, await item.file.arrayBuffer());
        }

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `NF_OC_${new Date().toISOString().slice(0,10)}.zip`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('Erro ao gerar ZIP: ' + err.message);
      }

      btnDownloadAll.disabled = false;
      btnDownloadAll.textContent = `Baixar todos em ZIP (${successfulFiles.length})`;
    });

    // Limpar
    btnClearList.addEventListener('click', () => {
      if (confirm('Limpar toda a lista?')) {
        resultsBody.innerHTML = '';
        successfulFiles = [];
        btnDownloadAll.style.display = 'none';
        btnClearList.style.display = 'none';
        resultsDiv.style.display = 'none';
        progressBar.style.display = 'none';
        statusEl.style.display = 'none';
        fileInput.value = '';
      }
    });
  </script>
</body>
</html>
